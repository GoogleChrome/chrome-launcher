name: 🛠

on:
  push:
    branches: [main]
  pull_request: # run on all PRs, not just PRs to a particular branch

permissions:
  contents: read

jobs:
  basics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [ 'lts/*', 'lts/-1', 'lts/-2' ]
    name: basics (node ${{ matrix.node }})

    steps:
    - name: git clone
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node }}
        cache: 'yarn'

    - run: yarn --frozen-lockfile --network-timeout 1000000
    - run: yarn build
    - name: Type-check tests
      run: yarn tsc -p test

    - run: yarn test-formatting

    # Run tests that require headful Chrome.
    - run: sudo apt-get install xvfb
    - name: yarn test
      run: xvfb-run --auto-servernum yarn test --reporter=spec

  unit:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: unit_${{ matrix.os }}

    steps:
    - name: git clone
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
        cache: 'yarn'

    - run: yarn --frozen-lockfile --network-timeout 1000000
    - run: yarn build
    - run: yarn test --reporter=spec
